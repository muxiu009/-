<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>相伴余生 · 深情告白</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0015;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #greeting {
      position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 6vw; font-weight: bold;
      text-shadow: 0 0 25px #ff9eb5, 0 0 45px #ff4d6d;
      white-space: nowrap; opacity: 0; transition: opacity 2s ease; z-index: 20;
      pointer-events: none;
    }
    .word {
      position: absolute;
      font-size: 5vw; font-weight: bold; color: #fff;
      text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transform: translateX(100vw);
    }
    .word.show { animation: floatWord 4s ease-in-out forwards; }
    @keyframes floatWord {
      0% { opacity: 0; transform: translateX(80vw); }
      15% { opacity: 1; transform: translateX(0vw); }
      70% { opacity: 1; transform: translateX(-10vw); }
      100% { opacity: 0; transform: translateX(-100vw); }
    }
    #msgBox {
      position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
      background: rgba(20, 0, 30, 0.85); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 100, 130, 0.6); border-radius: 24px;
      padding: 6vw 8vw; text-align: center; color: #fff;
      pointer-events: auto; opacity: 0; transition: opacity 0.8s ease;
      box-shadow: 0 0 40px rgba(255, 70, 100, 0.4);
    }
    #msgBox.show { opacity: 1; }
    .msg-text {
      font-size: 5.5vw; font-weight: bold; margin-bottom: 20px;
      letter-spacing: 2px; text-shadow: 0 0 15px #ff9eb5;
    }
    #confirmBtn {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      border: none; color: white; font-size: 5vw; font-weight: bold;
      padding: 12px 40px; border-radius: 50px; letter-spacing: 3px;
      cursor: pointer; box-shadow: 0 8px 25px rgba(255, 70, 100, 0.5);
      transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; outline: none;
    }
    #confirmBtn:active { transform: scale(0.95); box-shadow: 0 4px 15px rgba(255, 70, 100, 0.7); }
    .ending-text {
      position: absolute; width: 100%; text-align: center; color: #fff;
      font-weight: bold; pointer-events: none; opacity: 0;
      transition: opacity 1.2s ease; text-shadow: 0 0 25px rgba(255, 80, 120, 0.9); z-index: 20;
    }
    #endLove { top: 40%; font-size: 8vw; text-shadow: 0 0 35px #ff3366, 0 0 70px #ff3366; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="heartCanvas"></canvas>
    <div id="overlay">
      <div id="greeting">亲爱的单恩雪女士，请查收我们的余生</div>
      <div id="wordsContainer"></div>
      <div id="msgBox">
        <div class="msg-text">你是否愿意与我相伴余生</div>
        <button id="confirmBtn">我愿意</button>
      </div>
      <div class="ending-text" id="endLove"></div>
    </div>
    <canvas id="storyCanvas" style="display:none;"></canvas>
  </div>
  <script>
    (function() {
      // ========== DOM ==========
      const heartCanvas = document.getElementById('heartCanvas');
      const heartCtx = heartCanvas.getContext('2d');
      const storyCanvas = document.getElementById('storyCanvas');
      const storyCtx = storyCanvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const greeting = document.getElementById('greeting');
      const wordsContainer = document.getElementById('wordsContainer');
      const msgBox = document.getElementById('msgBox');
      const confirmBtn = document.getElementById('confirmBtn');
      const endLove = document.getElementById('endLove');

      let width, height;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        heartCanvas.width = width;
        heartCanvas.height = height;
        storyCanvas.width = width;
        storyCanvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      // 开头问候
      setTimeout(() => { greeting.style.opacity = '1'; }, 400);
      setTimeout(() => { greeting.style.opacity = '0'; }, 3500);

      // ========== 音频引擎 ==========
      let audioCtx = null;
      let currentMusicInterval = null;
      let currentMusicGain = null;

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function stopMusic() {
        if (currentMusicInterval) { clearInterval(currentMusicInterval); currentMusicInterval = null; }
        if (currentMusicGain) {
          currentMusicGain.gain.setValueAtTime(0, audioCtx.currentTime);
          currentMusicGain = null;
        }
      }

      function playNote(freq, duration, startTime, gainNode) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gainNode);
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      function playSceneMusic(scene) {
        stopMusic();
        if (!audioCtx) return;
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.08;
        gainNode.connect(audioCtx.destination);
        currentMusicGain = gainNode;
        let notes = [], tempo = 0.5;
        switch(scene) {
          case '相遇': notes = ['C4','E4','G4','C5','G4','E4']; tempo = 0.6; break;
          case '相恋': notes = ['D4','F4','A4','F4','E4','D4']; tempo = 0.7; break;
          case '结婚': notes = ['C4','C4','D4','C4','F4','E4','C4','C4']; tempo = 0.65; break;
          case '孕育': notes = ['C4','E4','G4','C5','G4','E4','C4']; tempo = 0.8; break;
          case '生子': notes = ['C5','G4','E4','C4','D4','E4']; tempo = 0.55; break;
          case '中年': notes = ['E4','G4','A4','G4','E4','D4']; tempo = 0.75; break;
          case '老年': notes = ['C4','D4','E4','D4','C4','A3','G3']; tempo = 0.9; break;
          default: return;
        }
        const freqMap = {
          'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'C5':523.25,'A3':220.00,'G3':196.00
        };
        let idx = 0;
        function schedule() {
          if (!audioCtx || !currentMusicGain) return;
          const now = audioCtx.currentTime;
          const note = notes[idx % notes.length];
          const freq = freqMap[note] || 261.63;
          playNote(freq, tempo * 0.9, now, gainNode);
          idx++;
        }
        schedule();
        currentMusicInterval = setInterval(schedule, tempo * 1000);
      }

      function playFireworkSound() {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.2;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
      }

      // ========== 漂浮情话（7句，真挚不油腻） ==========
      const loveWords = [
        "从遇见你的那一刻起，我的世界便充满了色彩",
        "你是我平淡生活里最温柔的惊喜",
        "和你在一起的每一天，都像被阳光拥抱",
        "我想牵着你的手，走过清晨与黄昏",
        "你的名字，是我听过最短的情诗",
        "遇见你之后，所有未来都值得期待",
        "你一笑，我的整个世界都亮了"
      ];
      let wordElements = [];
      let wordIndex = 0;
      let wordInterval = null;

      function createWordElements() {
        wordsContainer.innerHTML = '';
        wordElements = [];
        const positions = [16, 28, 40, 52, 64, 76, 88];
        loveWords.forEach((text, i) => {
          const div = document.createElement('div');
          div.className = 'word';
          div.style.top = positions[i] + '%';
          div.textContent = text;
          wordsContainer.appendChild(div);
          wordElements.push(div);
        });
      }

      function startFloatingWords() {
        wordIndex = 0;
        function showNext() {
          if (wordIndex < wordElements.length) {
            wordElements[wordIndex].classList.add('show');
            wordIndex++;
          } else {
            clearInterval(wordInterval);
            setTimeout(() => { msgBox.classList.add('show'); }, 2000);
          }
        }
        showNext();
        wordInterval = setInterval(showNext, 2800);
      }

      // ========== 爱心雨与聚合（深度优化：零黑屏，画面即显） ==========
      const scaleHeart = Math.min(width, height) / 38;
      const offsetX = width / 2;
      const offsetY = height / 2 - scaleHeart * 2.5;
      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }
      const numParticles = 180;
      const targets = [];
      for (let i = 0; i < numParticles; i++) {
        let t = (i / numParticles) * Math.PI * 2;
        let x = heartX(t) * scaleHeart + offsetX;
        let y = -heartY(t) * scaleHeart + offsetY;
        targets.push({x, y});
      }
      const particles = [];
      for (let i = 0; i < numParticles; i++) {
        // 所有粒子初始都在屏幕上半部分，保证第一帧就有大量爱心可见
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.5 - 20,   // 都在屏幕上半区，不会跑到屏幕外下方
          size: Math.random() * 14 + 8,
          color: `hsl(${340 + Math.random()*20}, 85%, ${55+Math.random()*30}%)`,
          target: targets[i],
          state: 'falling',
          startX: 0, startY: 0, progress: 0
        });
      }
      let heartStartTime = null;
      let phase = 'falling';
      const fallingPhaseEnd = 2.0;
      const movingDuration = 1.8;
      let heartDoneTime = 0;
      let wordsTriggered = false;
      let msgBoxShown = false;

      function drawTinyHeart(ctx, x, y, size, color) {
        ctx.save(); ctx.translate(x, y); const s = size / 18; ctx.scale(s, s);
        ctx.beginPath();
        ctx.moveTo(0, -3);
        ctx.bezierCurveTo(-8, -8, -15, 2, 0, 11);
        ctx.bezierCurveTo(15, 2, 8, -8, 0, -3);
        ctx.fillStyle = color;
        ctx.shadowColor = 'rgba(255,80,120,0.7)';
        ctx.shadowBlur = 5;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      function heartLoop(ts) {
        if (!heartStartTime) heartStartTime = ts;
        const elapsed = (ts - heartStartTime) / 1000;
        heartCtx.clearRect(0, 0, width, height);

        // 背景：深色但带有明显光晕，绝不纯黑
        const grad = heartCtx.createRadialGradient(offsetX, offsetY, 0, offsetX, offsetY, Math.max(width,height)*0.8);
        grad.addColorStop(0, 'rgba(80,10,40,0.55)');
        grad.addColorStop(0.5, 'rgba(30,0,20,0.75)');
        grad.addColorStop(1, '#0a0015');
        heartCtx.fillStyle = grad;
        heartCtx.fillRect(0,0,width,height);

        // 闪烁星光 (立即可见)
        for (let i=0; i<35; i++) {
          const sx = (i*47 + elapsed*25) % width;
          const sy = (i*29 + elapsed*20) % height;
          heartCtx.fillStyle = `rgba(255,210,230,${0.25+Math.sin(elapsed*3+i)*0.2})`;
          heartCtx.beginPath();
          heartCtx.arc(sx, sy, 1.5, 0, Math.PI*2);
          heartCtx.fill();
        }

        if (phase === 'falling' && elapsed >= fallingPhaseEnd) {
          phase = 'moving';
          particles.forEach(p => { p.state = 'moving'; p.startX = p.x; p.startY = p.y; });
        }
        if (phase === 'moving' && elapsed >= fallingPhaseEnd + movingDuration) {
          phase = 'done';
          heartDoneTime = elapsed;
          particles.forEach(p => { p.state = 'done'; p.x = p.target.x; p.y = p.target.y; });
        }

        if (phase === 'falling') {
          particles.forEach(p => {
            p.y += p.size * 0.4 + 2.5;
            if (p.y > height + 30) { p.y = -30; p.x = Math.random() * width; }
            drawTinyHeart(heartCtx, p.x, p.y, p.size, p.color);
          });
        } else if (phase === 'moving') {
          const moveElapsed = elapsed - fallingPhaseEnd;
          particles.forEach(p => {
            if (p.state === 'moving') {
              p.progress = Math.min(moveElapsed / movingDuration, 1);
              const t = p.progress < 0.5 ? 2*t*t : -1+(4-2*t)*t;
              const cx = p.startX + (p.target.x - p.startX) * t;
              const cy = p.startY + (p.target.y - p.startY) * t;
              drawTinyHeart(heartCtx, cx, cy, p.size, p.color);
              if (p.progress >= 1) p.state = 'done';
            }
          });
        } else if (phase === 'done') {
          const beat = 1 + 0.04 * Math.sin((elapsed - heartDoneTime) * 3.5);
          heartCtx.save();
          heartCtx.translate(offsetX, offsetY);
          heartCtx.scale(beat, beat);
          heartCtx.translate(-offsetX, -offsetY);
          particles.forEach(p => drawTinyHeart(heartCtx, p.target.x, p.target.y, p.size*0.95, p.color));
          heartCtx.restore();
          for (let i=0; i<14; i++) {
            const angle = (elapsed*0.4 + i*Math.PI*2/14) % (Math.PI*2);
            const radius = scaleHeart*19 + Math.sin(elapsed*1.5+i)*25;
            drawTinyHeart(heartCtx, offsetX+Math.cos(angle)*radius, offsetY+Math.sin(angle)*radius*0.8, 5+Math.abs(Math.sin(elapsed+i))*6, `hsl(${340+i*5},80%,70%)`);
          }
          if (!wordsTriggered) {
            wordsTriggered = true;
            startFloatingWords();
          }
        }

        if (!msgBoxShown || msgBox.classList.contains('show')) {
          requestAnimationFrame(heartLoop);
        } else {
          requestAnimationFrame(heartLoop);
        }
      }

      createWordElements();
      requestAnimationFrame(heartLoop);

      // ========== 确认按钮 ==========
      confirmBtn.addEventListener('click', () => {
        heartCanvas.style.display = 'none';
        msgBox.classList.remove('show');
        overlay.style.pointerEvents = 'none';
        storyCanvas.style.display = 'block';
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        startStoryAnimation();
      });
      confirmBtn.addEventListener('touchstart', (e) => { e.preventDefault(); confirmBtn.click(); });

      // ========== 故事动画（一生之旅，每个场景配乐） ==========
      function startStoryAnimation() {
        const ctx = storyCtx;
        let storyStart = null;
        const totalDuration = 62;
        let sceneIdx = 0;
        let sceneStartTime = 0;
        let endingActive = false;
        let fireworks = [];
        let fireworkSoundTimer = 0;

        const scenes = [
          { name: '相遇', duration: 9, bg: 'spring' },
          { name: '相恋', duration: 8, bg: 'rain' },
          { name: '结婚', duration: 11, bg: 'wedding' },
          { name: '孕育', duration: 7, bg: 'home' },
          { name: '生子', duration: 7, bg: 'hospital' },
          { name: '中年', duration: 9, bg: 'autumn' },
          { name: '老年', duration: 11, bg: 'sunset' }
        ];

        function drawSky(type) {
          const grad = ctx.createLinearGradient(0,0,0,height);
          const skies = {
            spring: ['#87CEEB','#E0F7FA','#B2DFDB'],
            rain: ['#5D6D7E','#85929E','#ABB2B9'],
            wedding: ['#FADBD8','#F9E79F','#FDEBD0'],
            home: ['#FFF3E0','#FFE0B2'],
            hospital: ['#E8F8F5','#D1F2EB'],
            autumn: ['#FAD7A1','#F5B041','#DC7633'],
            sunset: ['#FF7E5F','#FEB47B','#8B2252']
          };
          const cols = skies[type] || ['#000','#000'];
          grad.addColorStop(0, cols[0]);
          grad.addColorStop(0.7, cols[1] || cols[0]);
          grad.addColorStop(1, cols[2] || cols[1] || cols[0]);
          ctx.fillStyle = grad;
          ctx.fillRect(0,0,width,height);
        }

        function drawGround(type) {
          const colors = {
            spring:'#7DCEA0', rain:'#616A6B', wedding:'#7DCEA0',
            home:'#D7CCC8', hospital:'#D7CCC8', autumn:'#C68E58', sunset:'#4A2C2A'
          };
          ctx.fillStyle = colors[type] || '#666';
          ctx.fillRect(0, height*0.75, width, height*0.25);
        }

        function drawPerson(x, y, scale, opts={}) {
          const { gender='male', age='young', pose='stand', bodyColor } = opts;
          ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
          const skin = age==='old' ? '#E8C9A0' : '#FDDCB5';
          const hair = age==='old' ? '#D7D7D9' : (gender==='female' ? '#3E2723' : '#2C1E16');
          ctx.beginPath(); ctx.arc(0,-38,14,0,Math.PI*2); ctx.fillStyle=skin; ctx.fill();
          ctx.fillStyle='#1A1A1A';
          ctx.beginPath(); ctx.arc(-5,-41,1.8,0,Math.PI); ctx.fill();
          ctx.beginPath(); ctx.arc(5,-41,1.8,0,Math.PI); ctx.fill();
          ctx.beginPath(); ctx.strokeStyle='#8B5E3C'; ctx.lineWidth=1.2;
          ctx.arc(0,-34,6,0.1,Math.PI-0.1); ctx.stroke();
          ctx.fillStyle=hair;
          if(gender==='female') {
            ctx.beginPath(); ctx.arc(0,-40,15,Math.PI,0); ctx.fill();
            ctx.fillRect(-15,-45,30,12);
            ctx.beginPath(); ctx.ellipse(-13,-33,5,16,-0.2,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(13,-33,5,16,0.2,0,Math.PI*2); ctx.fill();
          } else {
            ctx.beginPath(); ctx.arc(0,-41,15,Math.PI,0); ctx.fill();
            ctx.fillRect(-14,-47,28,10);
          }
          const bodyClr = bodyColor || (gender==='female'?'#E74C3C':'#5DADE2');
          ctx.fillStyle = bodyClr;
          if(pose==='kneel') ctx.fillRect(-12,-12,24,18);
          else ctx.fillRect(-12,-24,24,30);
          ctx.strokeStyle='#2C3E50'; ctx.lineWidth=4;
          if(pose==='kneel') {
            ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(-14,20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6,6); ctx.lineTo(14,20); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(-8,24); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6,6); ctx.lineTo(8,24); ctx.stroke();
          }
          ctx.strokeStyle=skin; ctx.lineWidth=5;
          if(pose==='holdBaby') {
            ctx.beginPath(); ctx.moveTo(-12,-20); ctx.lineTo(-20,-16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(12,-20); ctx.lineTo(18,-18); ctx.stroke();
            ctx.fillStyle='#FADBD8'; ctx.fillRect(-4,-30,14,10);
            ctx.fillStyle='#F5B7B1'; ctx.beginPath(); ctx.arc(3,-32,5,0,Math.PI*2); ctx.fill();
          } else if(pose==='kneel') {
            ctx.beginPath(); ctx.moveTo(-12,-6); ctx.lineTo(-20,-16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(12,-6); ctx.lineTo(20,-16); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(-12,-20); ctx.lineTo(-22,-6); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(12,-20); ctx.lineTo(22,-6); ctx.stroke();
          }
          ctx.restore();
        }

        function drawFirework(x, y, color) {
          for (let i=0; i<12; i++) {
            const angle = (i/12)*Math.PI*2;
            const dx = Math.cos(angle)*8, dy = Math.sin(angle)*8;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x+dx, y+dy, 3, 0, Math.PI*2); ctx.fill();
          }
        }

        function drawScene(scene, progress, elapsed) {
          const { name, bg } = scene;
          drawSky(bg); drawGround(bg);
          const cx = width/2, gy = height*0.75;
          if(name==='相遇') {
            for(let i=0;i<25;i++){ctx.fillStyle=`rgba(255,182,193,0.4)`;ctx.beginPath();ctx.arc(Math.random()*width,Math.random()*height*0.7,2,0,Math.PI*2);ctx.fill();}
            drawPerson(cx-100+progress*100, gy-30, 0.9, {gender:'male',age:'young'});
            drawPerson(cx+100-progress*100, gy-30, 0.9, {gender:'female',age:'young'});
            ctx.fillStyle='#fff';ctx.font='bold 5vw "PingFang SC"';ctx.textAlign='center';
            ctx.fillText('那年春天，我们相遇', cx, height*0.2);
          } else if(name==='相恋') {
            for(let i=0;i<60;i++){ctx.strokeStyle='rgba(200,220,240,0.5)';ctx.beginPath();ctx.moveTo(Math.random()*width,Math.random()*height*0.85);ctx.lineTo(-2+Math.random()*4,10+Math.random()*15);ctx.stroke();}
            drawPerson(cx-15, gy-38, 0.9, {gender:'male',bodyColor:'#2C3E50'});
            drawPerson(cx+15, gy-38, 0.9, {gender:'female',bodyColor:'#E91E63'});
            ctx.fillStyle='#34495E';ctx.beginPath();ctx.ellipse(cx, gy-80, 35, 12, 0, Math.PI, 0);ctx.fill();
            ctx.fillStyle='#2C3E50';ctx.fillRect(cx-2, gy-80, 4, 30);
            ctx.fillStyle='#fff';ctx.fillText('从此，风雨同行', cx, height*0.2);
          } else if(name==='结婚') {
            ctx.fillStyle='#F5B7B1';ctx.fillRect(cx-40, gy-90, 80, 10);
            ctx.beginPath();ctx.arc(cx, gy-90, 40, Math.PI, 0);ctx.fill();
            if(progress<0.5) {
              drawPerson(cx-25, gy-20-(progress/0.5)*15, 0.9, {gender:'male',pose:'kneel',bodyColor:'#1C1C1C'});
              drawPerson(cx+30, gy-35, 0.95, {gender:'female',bodyColor:'#FFFFFF'});
            } else {
              drawPerson(cx-20, gy-35, 0.9, {gender:'male',bodyColor:'#1C1C1C'});
              drawPerson(cx+25, gy-35, 0.95, {gender:'female',bodyColor:'#FFFFFF'});
            }
            ctx.fillStyle='#fff';ctx.fillText('执子之手，与子偕老', cx, height*0.15);
          } else if(name==='孕育') {
            drawPerson(cx-20, gy-38, 0.9, {gender:'male',bodyColor:'#3498DB'});
            drawPerson(cx+30, gy-38, 1.0, {gender:'female',bodyColor:'#F1948A'});
            ctx.fillStyle='#F1948A';ctx.beginPath();ctx.arc(cx+30, gy-55, 13+Math.sin(elapsed*3)*1.5, 0, Math.PI*2);ctx.fill();
            ctx.fillStyle='#fff';ctx.fillText('爱的结晶', cx, height*0.18);
          } else if(name==='生子') {
            drawPerson(cx-35, gy-38, 0.9, {gender:'male',bodyColor:'#2ECC71'});
            drawPerson(cx+25, gy-38, 0.95, {gender:'female',pose:'holdBaby',bodyColor:'#F5B7B1'});
            ctx.fillStyle='#fff';ctx.fillText('新的生命', cx, height*0.18);
          } else if(name==='中年') {
            for(let i=0;i<20;i++){ctx.fillStyle=`rgba(210,120,40,0.5)`;ctx.beginPath();ctx.ellipse(Math.random()*width,height*0.4+Math.random()*height*0.4,3,1.5,0.3,0,Math.PI*2);ctx.fill();}
            drawPerson(cx-55, gy-35, 0.9, {gender:'male',age:'middle',bodyColor:'#5D6D7E'});
            drawPerson(cx-20, gy-35, 0.9, {gender:'female',age:'middle',bodyColor:'#C39BD3'});
            drawPerson(cx+45, gy-40, 0.7, {gender:'male',age:'young',bodyColor:'#F39C12'});
            ctx.fillStyle='#fff';ctx.fillText('时光静好', cx, height*0.18);
          } else if(name==='老年') {
            const sunX=cx, sunY=height*0.55;
            const grad=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,60);
            grad.addColorStop(0,'#FFF9C4');grad.addColorStop(0.5,'#FFB74D');grad.addColorStop(1,'rgba(255,87,34,0)');
            ctx.fillStyle=grad;ctx.beginPath();ctx.arc(sunX,sunY,50+Math.sin(elapsed*0.5)*5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#5D4037';ctx.fillRect(cx-50, gy-15, 100, 12);
            ctx.fillRect(cx-45, gy-30, 8, 20);ctx.fillRect(cx+37, gy-30, 8, 20);
            drawPerson(cx-25, gy-25, 0.85, {gender:'male',age:'old',bodyColor:'#8D6E63'});
            drawPerson(cx+25, gy-25, 0.85, {gender:'female',age:'old',bodyColor:'#A1887F'});
            ctx.fillStyle='#fff';ctx.shadowColor='rgba(255,140,0,0.8)';ctx.shadowBlur=12;
            ctx.fillText('相伴余生', cx, height*0.12);ctx.shadowBlur=0;
          }
        }

        function storyLoop(ts) {
          if (!storyStart) {
            storyStart = ts;
            sceneStartTime = ts;
            playSceneMusic('相遇');
          }
          const elapsedTotal = (ts - storyStart) / 1000;
          if (elapsedTotal > totalDuration && !endingActive) {
            endingActive = true;
            stopMusic();
            setTimeout(() => {
              endLove.style.opacity = '1';
              endLove.textContent = '💖 攒满世间温柔，尽数赠予心上人 💖';
            }, 500);
            setTimeout(() => {
              endLove.textContent = '💖 平淡朝夕里，藏着最长久的深情 💖';
            }, 3500);
            setTimeout(() => {
              endLove.textContent = '🌹 满心期许皆是你，往后朝夕不负相遇 🌹';
            }, 6500);
            setTimeout(() => {
              endLove.textContent = '🌹 保持热爱，奔赴属于我们的岁岁年年 🌹';
            }, 9500);
            setTimeout(() => {
              endLove.textContent = '我爱你，老婆';
              endLove.style.fontSize = '10vw';
            }, 13000);
          }

          if (endingActive) {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = '#0a0015'; ctx.fillRect(0,0,width,height);
            if (fireworkSoundTimer <= 0 && fireworks.length < 8) {
              playFireworkSound();
              fireworkSoundTimer = 0.8;
            }
            fireworkSoundTimer -= 0.016;
            if (Math.random() < 0.12) {
              fireworks.push({
                x: Math.random()*width,
                y: Math.random()*height*0.6 + height*0.1,
                color: `hsl(${Math.random()*360}, 85%, 65%)`,
                life: 1.0
              });
            }
            fireworks.forEach(f => { f.life -= 0.015; });
            fireworks = fireworks.filter(f => f.life > 0);
            fireworks.forEach(f => drawFirework(f.x, f.y, f.color));
            requestAnimationFrame(storyLoop);
            return;
          }

          let sceneElapsed = (ts - sceneStartTime) / 1000;
          let accumulated = 0;
          for (let i = 0; i < scenes.length; i++) {
            if (elapsedTotal < accumulated + scenes[i].duration) {
              if (sceneIdx !== i) {
                sceneIdx = i;
                sceneStartTime = ts - accumulated * 1000;
                sceneElapsed = (ts - sceneStartTime) / 1000;
                playSceneMusic(scenes[i].name);
              }
              break;
            }
            accumulated += scenes[i].duration;
          }
          const currentScene = scenes[sceneIdx];
          const progress = Math.min(sceneElapsed / currentScene.duration, 1.0);
          ctx.clearRect(0,0,width,height);
          drawScene(currentScene, progress, sceneElapsed);
          requestAnimationFrame(storyLoop);
        }

        requestAnimationFrame(storyLoop);
      }
    })();
  </script>
</body>
</html>
